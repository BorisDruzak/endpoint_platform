name: Endpoint Operations provider release gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "endpoint_server/**"
      - "pc_agent/**"
      - "packaging/**"
      - "tools/**"
      - "tests/**"
      - "requirements/**"
      - "requirements-ci.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "webapp/**"
      - "endpoint_contracts/**"
      - "endpoint_server/http/**"
      - "endpoint_server/operations/**"
      - "endpoint_server/gateway/**"
      - "endpoint_server/context/**"
      - "endpoint_server/device_binding/**"
      - "endpoint_server/auth/**"
      - "endpoint_server/db/**"
      - "contracts/**"
      - "tools/contracts/**"
      - "tests/contracts/**"
      - "tests/operations/**"
      - "tests/gateway/**"
      - "tests/context/**"
      - "tests/server/test_device_binding*.py"
      - "tests/server/test_migrations.py"
      - ".github/workflows/endpoint-operations-provider.yml"
  push:
    branches:
      - main
    paths:
      - "endpoint_server/**"
      - "pc_agent/**"
      - "packaging/**"
      - "tools/**"
      - "tests/**"
      - "requirements/**"
      - "requirements-ci.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "webapp/**"
      - "endpoint_contracts/**"
      - "endpoint_server/http/**"
      - "endpoint_server/operations/**"
      - "endpoint_server/gateway/**"
      - "endpoint_server/context/**"
      - "endpoint_server/device_binding/**"
      - "endpoint_server/auth/**"
      - "endpoint_server/db/**"
      - "contracts/**"
      - "tools/contracts/**"
      - "tests/contracts/**"
      - "tests/operations/**"
      - "tests/gateway/**"
      - "tests/context/**"
      - "tests/server/test_device_binding*.py"
      - "tests/server/test_migrations.py"
      - ".github/workflows/endpoint-operations-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      ENDPOINT_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt -r requirements/build-linux.txt

      - name: Record exact source and dependency evidence
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"], "checkout differs from dispatched source"
          evidence = {key: os.environ.get(key) for key in (
              "GITHUB_REF", "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW_REF")}
          evidence.update(head=head, python=platform.python_version(), os=platform.platform())
          Path("artifacts/source.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
          python -m pip freeze > artifacts/dependencies.txt

      - name: Run complete server and agent runtime suites
        run: >-
          timeout --signal=INT --kill-after=30s 20m
          python -m pytest tests pc_agent/tests -q -o faulthandler_timeout=120
          --junitxml=artifacts/endpoint-operations-provider.xml

      - name: Check generated contract artifacts
        run: python tools/contracts/generate_contract_artifacts.py --check

      - name: Compile provider and headless-agent modules
        run: python -m compileall -q endpoint_contracts endpoint_server pc_agent

      - name: Check for whitespace errors
        run: git diff --check

      - name: Upload provider release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-operations-provider
          path: |
            artifacts/endpoint-operations-provider.xml
            artifacts/source.json
            artifacts/dependencies.txt
          if-no-files-found: error
