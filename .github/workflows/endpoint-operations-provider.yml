name: Endpoint Operations provider release gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "endpoint_server/**"
      - "pc_agent/**"
      - "packaging/**"
      - "tools/**"
      - "tests/**"
      - "requirements/**"
      - "requirements-ci.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "webapp/**"
      - "endpoint_contracts/**"
      - "endpoint_server/http/**"
      - "endpoint_server/operations/**"
      - "endpoint_server/gateway/**"
      - "endpoint_server/context/**"
      - "endpoint_server/device_binding/**"
      - "endpoint_server/auth/**"
      - "endpoint_server/db/**"
      - "contracts/**"
      - "tools/contracts/**"
      - "tests/contracts/**"
      - "tests/operations/**"
      - "tests/gateway/**"
      - "tests/context/**"
      - "tests/server/test_device_binding*.py"
      - "tests/server/test_migrations.py"
      - ".github/workflows/endpoint-operations-provider.yml"
  push:
    branches:
      - main
    paths:
      - "endpoint_server/**"
      - "pc_agent/**"
      - "packaging/**"
      - "tools/**"
      - "tests/**"
      - "requirements/**"
      - "requirements-ci.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "webapp/**"
      - "endpoint_contracts/**"
      - "endpoint_server/http/**"
      - "endpoint_server/operations/**"
      - "endpoint_server/gateway/**"
      - "endpoint_server/context/**"
      - "endpoint_server/device_binding/**"
      - "endpoint_server/auth/**"
      - "endpoint_server/db/**"
      - "contracts/**"
      - "tools/contracts/**"
      - "tests/contracts/**"
      - "tests/operations/**"
      - "tests/gateway/**"
      - "tests/context/**"
      - "tests/server/test_device_binding*.py"
      - "tests/server/test_migrations.py"
      - ".github/workflows/endpoint-operations-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      ENDPOINT_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt -r requirements/build-linux.txt

      - name: Record exact source and dependency evidence
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"], "checkout differs from dispatched source"
          evidence = {key: os.environ.get(key) for key in (
              "GITHUB_REF", "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW_REF")}
          evidence.update(head=head, python=platform.python_version(), os=platform.platform())
          Path("artifacts/source.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
          python -m pip freeze > artifacts/dependencies.txt

      - name: Run server and Linux agent runtime suites
        run: >-
          timeout --signal=INT --kill-after=30s 20m
          python -m pytest tests pc_agent/tests -q -o faulthandler_timeout=120 --ignore=pc_agent/tests/windows
          --junitxml=artifacts/endpoint-operations-provider.xml

      - name: Verify Linux packaging and frozen Core
        run: python -m pytest -q tests/build --junitxml=artifacts/linux-build.xml

      - name: Check generated contract artifacts
        run: python tools/contracts/generate_contract_artifacts.py --check

      - name: Compile provider and headless-agent modules
        run: python -m compileall -q endpoint_contracts endpoint_server pc_agent

      - name: Check for whitespace errors
        run: git diff --check

      - name: Upload provider release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-operations-provider
          path: |
            artifacts/endpoint-operations-provider.xml
            artifacts/linux-build.xml
            artifacts/source.json
            artifacts/dependencies.txt
          if-no-files-found: error

  windows-release-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt -r requirements/build-windows.txt

      - name: Record exact source and dependency evidence
        shell: pwsh
        run: |
          [System.IO.Directory]::CreateDirectory((Join-Path (Get-Location) artifacts)) | Out-Null
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw "Checkout differs from dispatched source"
          }
          $pythonVersion = (python --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{
            head = $head
            ref = $env:GITHUB_REF
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            workflow_ref = $env:GITHUB_WORKFLOW_REF
            python = $pythonVersion
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM artifacts/source.json
          python -m pip freeze | Set-Content -Encoding utf8NoBOM artifacts/dependencies.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare installed service SID fixtures
        shell: pwsh
        run: |
          foreach ($name in @('EndpointAgent', 'EndpointAgentUpdater')) {
            if (Get-Service -Name $name -ErrorAction SilentlyContinue) {
              throw "Unexpected pre-existing Endpoint service: $name"
            }
            # Native ACL tests need Windows to resolve the exact product identities.
            # The hosted CI fixture stays disabled and is never started.
            $image = Join-Path $env:SystemRoot 'System32\cmd.exe'
            New-Service -Name $name -BinaryPathName ('"' + $image + '" /c exit 1') -StartupType Disabled | Out-Null
          }
          @'
          import win32security
          from pc_agent.platform.windows.acl import _machine_data_service_sid
          for name in ('EndpointAgent', 'EndpointAgentUpdater'):
              principal = 'NT SERVICE\\' + name
              sid, _, _ = win32security.LookupAccountName(None, principal)
              assert win32security.ConvertSidToStringSid(sid) == _machine_data_service_sid(principal)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows agent, PowerShell and updater compatibility suites
        run: >-
          python -m pytest -q
          pc_agent/tests/windows
          tests/deploy/test_keycloak_ad_pilot.py
          tests/packaging/test_installation_notification_stage.py
          tests/packaging/test_setup_preflight_process.py
          tests/packaging/test_staged_cleanup_retry.py
          tests/packaging/test_support_access_signing.py
          tests/packaging/test_support_staged_payload.py
          tests/canary/test_legacy_fixture_schema.py
          --junitxml=artifacts/windows-release-gate.xml

      - name: Upload Windows release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-gate
          path: |
            artifacts/windows-release-gate.xml
            artifacts/source.json
            artifacts/dependencies.txt
          if-no-files-found: error
