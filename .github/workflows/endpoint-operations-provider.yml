name: Endpoint Operations provider release gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "endpoint_contracts/**"
      - "endpoint_server/http/**"
      - "endpoint_server/operations/**"
      - "endpoint_server/gateway/**"
      - "endpoint_server/device_binding/**"
      - "endpoint_server/auth/**"
      - "endpoint_server/db/**"
      - "contracts/**"
      - "tools/contracts/**"
      - "tests/contracts/**"
      - "tests/operations/**"
      - "tests/gateway/**"
      - "tests/server/test_device_binding*.py"
      - "tests/server/test_migrations.py"
      - ".github/workflows/endpoint-operations-provider.yml"
  push:
    branches:
      - main
    paths:
      - "endpoint_contracts/**"
      - "endpoint_server/http/**"
      - "endpoint_server/operations/**"
      - "endpoint_server/gateway/**"
      - "endpoint_server/device_binding/**"
      - "endpoint_server/auth/**"
      - "endpoint_server/db/**"
      - "contracts/**"
      - "tools/contracts/**"
      - "tests/contracts/**"
      - "tests/operations/**"
      - "tests/gateway/**"
      - "tests/server/test_device_binding*.py"
      - "tests/server/test_migrations.py"
      - ".github/workflows/endpoint-operations-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-release-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      ENDPOINT_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run provider contract, operations, and Gateway suites
        run: >-
          python -m pytest tests/contracts tests/operations tests/gateway
          tests/server/test_device_binding.py tests/server/test_device_binding_api.py
          tests/server/test_migrations.py -q
          --junitxml=artifacts/endpoint-operations-provider.xml

      - name: Check generated contract artifacts
        run: python tools/contracts/generate_contract_artifacts.py --check

      - name: Compile provider and headless-agent modules
        run: python -m compileall -q endpoint_contracts endpoint_server pc_agent

      - name: Check for whitespace errors
        run: git diff --check

      - name: Upload provider release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-operations-provider
          path: artifacts/endpoint-operations-provider.xml
          if-no-files-found: error
