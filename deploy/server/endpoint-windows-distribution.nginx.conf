# Include inside the existing canonical HTTPS server, inheriting its LAN ACL.
# Only immutable, reviewed public Windows artifacts belong under this root.
location /downloads/windows/ {
    alias /srv/endpoint-platform-distribution/windows/;
    autoindex off;
    disable_symlinks on;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
    add_header X-Content-Type-Options nosniff;
    limit_except GET { deny all; }
}
