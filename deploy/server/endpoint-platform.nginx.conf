# Included from nginx's http context. Query strings and headers are not fields.
log_format endpoint_platform_path_only escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time}';

server {
    listen 80;
    server_name endpoint.sosnadmin.local;
    access_log /var/log/nginx/endpoint-platform.access.log endpoint_platform_path_only;

    return 308 https://endpoint.sosnadmin.local$request_uri;
}

server {
    listen 443 ssl;
    server_name endpoint.sosnadmin.local;
    access_log /var/log/nginx/endpoint-platform.access.log endpoint_platform_path_only;

    ssl_certificate /etc/nginx/ssl/endpoint.sosnadmin.local.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/endpoint.sosnadmin.local.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 127.0.0.1;
    allow 192.168.100.0/24;
    allow 192.168.101.0/24;
    deny all;

    # Callback-only error suppression: raw query-bearing upstream errors must
    # not persist authorization codes. Safe access outcomes and auth audits stay.
    location = /auth/admin/callback {
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /auth/employee/callback {
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /agent/v1/connect {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 100s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
