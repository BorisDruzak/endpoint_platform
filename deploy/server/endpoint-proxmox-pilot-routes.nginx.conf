# Only these agent paths are available to the Proxmox management addresses.
location ~ ^/(healthz|agent/v1/enroll(/ack)?|api/v1/enrollment/debian/requests|api/v1/enrollment/linux/requests/[0-9a-f-]+/(status|claim))$ {
    allow 127.0.0.1;
    allow 192.168.100.0/24;
    allow 192.168.101.0/24;
    include /etc/nginx/snippets/endpoint-proxmox-pilot-allow.conf;
    deny all;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /downloads/debian/ {
    allow 127.0.0.1;
    allow 192.168.100.0/24;
    allow 192.168.101.0/24;
    include /etc/nginx/snippets/endpoint-proxmox-pilot-allow.conf;
    deny all;
    alias /srv/endpoint-platform-distribution/debian/;
    autoindex off;
    disable_symlinks on;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    limit_except GET { deny all; }
}
