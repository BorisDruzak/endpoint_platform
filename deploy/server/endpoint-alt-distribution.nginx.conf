# Include inside the existing canonical HTTPS server. Preserve its access ACL.
# Publish only reviewed public release files, as root-owned regular files.
location /downloads/alt/ {
    alias /var/lib/endpoint-platform/distribution/alt/;
    autoindex off;
    disable_symlinks on;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
    add_header X-Content-Type-Options nosniff;
    limit_except GET { deny all; }
}
