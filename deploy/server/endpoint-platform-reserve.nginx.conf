# Install alongside the main Endpoint site, which defines endpoint_platform_path_only.
server {
    listen 192.168.100.19:8443 ssl;
    server_name endpoint.sosnadmin.local;
    access_log /var/log/nginx/endpoint-platform-reserve.access.log endpoint_platform_path_only;
    ssl_certificate /etc/nginx/ssl/endpoint.sosnadmin.local.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/endpoint.sosnadmin.local.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 192.168.100.4;
    allow 192.168.100.11;
    allow 192.168.100.12;
    allow 192.168.100.19;
    allow 192.168.100.45;
    include /etc/nginx/snippets/endpoint-proxmox-pilot-allow.conf;
    deny all;

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /agent/v1/connect {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 100s;
    }

    location / {
        return 404;
    }
}
