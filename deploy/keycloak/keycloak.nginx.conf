server {
    listen 80;
    server_name sso.sosnadmin.local;
    return 308 https://sso.sosnadmin.local$request_uri;
}

server {
    listen 443 ssl;
    server_name sso.sosnadmin.local;
    ssl_certificate /etc/keycloak/tls/fullchain.pem;
    ssl_certificate_key /etc/keycloak/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 127.0.0.1;
    allow 192.168.100.0/24;
    allow 192.168.101.0/24;
    deny all;
    # Login URLs and authorization codes must not be recorded in access logs.
    access_log off;

    location /admin/ { deny all; }
    location /realms/master/ { deny all; }
    location ~ ^/(realms/sosnadmin/|resources/) {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host sso.sosnadmin.local;
        proxy_set_header X-Forwarded-Host sso.sosnadmin.local;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
    location / { return 404; }
}
