# PostgreSQL credentials are appended by install.sh; never commit that copy.
db=postgres
db-url=jdbc:postgresql://127.0.0.1:5544/keycloak
db-username=keycloak
hostname=https://sso.sosnadmin.local
hostname-strict=true
http-enabled=true
http-host=127.0.0.1
http-port=8088
http-management-host=127.0.0.1
http-management-port=9008
proxy-headers=xforwarded
proxy-trusted-addresses=127.0.0.1
truststore-paths=/etc/keycloak/trust
health-enabled=true
metrics-enabled=false
cache=local
http-max-queued-requests=100
log-level=INFO
log-console-output=default
