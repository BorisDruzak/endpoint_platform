        device_id:
          format: "uuid"
          title: "Device Id"
          type: "string"
        platform:
          enum:
            - "linux"
            - "windows"
          title: "Platform"
          type: "string"
        hardware_fingerprint:
          maxLength: 256
          minLength: 8
          title: "Hardware Fingerprint"
          type: "string"
      required:
        - "schema_version"
        - "device_id"
        - "platform"
        - "hardware_fingerprint"
      title: "DeviceIdentityV1"
      type: "object"
    AgentSessionV1:
      additionalProperties: false
