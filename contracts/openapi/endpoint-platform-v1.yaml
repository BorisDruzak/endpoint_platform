              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "401":
          description: "Service authentication failed"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "403":
          description: "Service scope is insufficient"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "422":
          description: "Validation Error"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      x-required-scopes:
        - "operations.read"
  "/api/v1/operations/{operation_id}/cancel":
    post:
      tags:
        - "endpoint-operations"
      summary: "Cancel Endpoint Operation"
      description: "Cancel one owner-scoped operation only while it remains undelivered."
      operationId: "cancel_endpoint_operation_api_v1_operations__operation_id__cancel_post"
      security:
        -
          ServiceBearer: []
      parameters:
        -
          name: "operation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Operation Id"
        -
          name: "X-Correlation-ID"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
