        "404":
          description: "Endpoint operation not found"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "409":
          description: "Operation has already reached delivery or a terminal state"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
