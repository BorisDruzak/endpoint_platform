openapi: "3.1.0"
info:
  title: "Endpoint Platform API"
  version: "v1"
paths:
  "/agent/v1/enroll":
    post:
      security:
        -
          AgentBearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AgentEnrollmentRequestV1"
      responses:
        "200":
          description: "Recovered committed enrollment delivery"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentEnrollmentDeliveryV1"
        "201":
          description: "Created enrollment delivery"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentEnrollmentDeliveryV1"
  "/agent/v1/enroll/retry":
    post:
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EnrollmentDeliveryProofV1"
      responses:
        "200":
          description: "Recovered unacknowledged delivery"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentEnrollmentDeliveryV1"
  "/agent/v1/enroll/ack":
    post:
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EnrollmentDeliveryProofV1"
      responses:
        "204":
          description: "Enrollment delivery acknowledged"
  "/agent/v1/credentials/rotate":
    post:
      security:
        -
          AgentBearer: []
      responses:
        "201":
          description: "Created pending device credential"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DeviceCredentialRotationV1"
  "/agent/v1/credentials/activate":
    post:
      security:
        -
          AgentBearer: []
      responses:
        "204":
          description: "Pending credential activated"
  "/agent/v1/updates/recommendation":
    get:
      security:
        -
          AgentBearer: []
      parameters:
        -
          name: "platform"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "linux_amd64"
              - "windows_amd64"
        -
          name: "channel"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "stable"
              - "canary"
      responses:
        "200":
          description: "Active update recommendation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentUpdateRecommendationV1"
        "204":
          description: "No active update assignment"
  "/agent/v1/updates/{operation_id}/ack":
    post:
      security:
        -
          AgentBearer: []
      parameters:
        -
          name: "operation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AgentUpdateAcknowledgementV1"
      responses:
        "204":
          description: "Update acknowledgement recorded"
  "/agent/v1/updates/{operation_id}/reports":
    post:
      security:
        -
          AgentBearer: []
      parameters:
        -
          name: "operation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AgentUpdateReportV1"
      responses:
        "200":
          description: "Update report recorded"
  "/api/v1/devices/{device_id}":
    get:
      tags:
        - "endpoint-operations"
      summary: "Read Endpoint Device"
      description: "Read one exact safe device summary for verified consumer mapping."
      operationId: "read_endpoint_device_api_v1_devices__device_id__get"
      security:
        -
          ServiceBearer: []
      parameters:
        -
          name: "device_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Device Id"
        -
          name: "X-Correlation-ID"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            title: "X-Correlation-Id"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DeviceSummaryEnvelope"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "404":
          description: "Device not found"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "401":
          description: "Service authentication failed"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "403":
          description: "Service scope is insufficient"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "422":
          description: "Validation Error"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      x-required-scopes:
        - "devices.read"
  "/api/v1/devices/{device_id}/capabilities":
    get:
      tags:
        - "endpoint-operations"
      summary: "Read Device Operation Capabilities"
      description: "Report only server acceptance for an active device and fixed capability."
      operationId: "read_device_operation_capabilities_api_v1_devices__device_id__capabilities_get"
      security:
        -
          ServiceBearer: []
      parameters:
        -
          name: "device_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Device Id"
        -
          name: "X-Correlation-ID"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            title: "X-Correlation-Id"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DeviceCapabilitiesEnvelope"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "404":
          description: "Active device not found"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "401":
          description: "Service authentication failed"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "403":
          description: "Service scope is insufficient"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "422":
          description: "Validation Error"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      x-required-scopes:
        - "devices.read"
  "/api/v1/devices/{device_id}/operations":
    post:
      tags:
        - "endpoint-operations"
      summary: "Create Device Operation"
      description: "Create or replay one operation owned by the authenticated service client."
      operationId: "create_device_operation_api_v1_devices__device_id__operations_post"
      security:
        -
          ServiceBearer: []
      parameters:
        -
          name: "device_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Device Id"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 8
            maxLength: 128
            pattern: "^[!-~][ -~]{6,126}[!-~]$"
            title: "Idempotency-Key"
        -
          name: "X-Correlation-ID"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            title: "X-Correlation-Id"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EndpointOperationCreateV1"
      responses:
        "201":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OperationResponseEnvelope"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "200":
          description: "Replayed endpoint operation"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OperationResponseEnvelope"
        "409":
          description: "Idempotency key conflict"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "503":
          description: "Safe result unavailable"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "401":
          description: "Service authentication failed"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "403":
          description: "Service scope is insufficient"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "422":
          description: "Validation Error"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      x-required-scopes:
        - "operations.create"
  "/api/v1/operations/{operation_id}":
    get:
      tags:
