openapi: "3.1.0"
info:
  title: "Endpoint Platform API"
  version: "v1"
paths:
  "/agent/v1/enroll":
    post:
      security:
        -
          AgentBearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AgentEnrollmentRequestV1"
      responses:
        "200":
          description: "Recovered committed enrollment delivery"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentEnrollmentDeliveryV1"
        "201":
          description: "Created enrollment delivery"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentEnrollmentDeliveryV1"
  "/agent/v1/enroll/retry":
    post:
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EnrollmentDeliveryProofV1"
      responses:
        "200":
          description: "Recovered unacknowledged delivery"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentEnrollmentDeliveryV1"
  "/agent/v1/enroll/ack":
    post:
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EnrollmentDeliveryProofV1"
      responses:
        "204":
          description: "Enrollment delivery acknowledged"
  "/agent/v1/credentials/rotate":
    post:
      security:
        -
          AgentBearer: []
      responses:
        "201":
          description: "Created pending device credential"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DeviceCredentialRotationV1"
  "/agent/v1/credentials/activate":
    post:
      security:
        -
          AgentBearer: []
      responses:
        "204":
          description: "Pending credential activated"
  "/agent/v1/updates/recommendation":
    get:
      security:
        -
          AgentBearer: []
      parameters:
        -
          name: "platform"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "linux_amd64"
              - "windows_amd64"
        -
          name: "channel"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "stable"
              - "canary"
      responses:
        "200":
          description: "Active update recommendation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentUpdateRecommendationV1"
        "204":
          description: "No active update assignment"
  "/agent/v1/updates/{operation_id}/ack":
    post:
      security:
        -
          AgentBearer: []
      parameters:
        -
          name: "operation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AgentUpdateAcknowledgementV1"
      responses:
        "204":
          description: "Update acknowledgement recorded"
  "/agent/v1/updates/{operation_id}/reports":
    post:
      security:
        -
          AgentBearer: []
      parameters:
        -
          name: "operation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AgentUpdateReportV1"
      responses:
        "200":
          description: "Update report recorded"
  "/api/v1/devices/{device_id}":
    get:
      tags:
        - "endpoint-operations"
      summary: "Read Endpoint Device"
      description: "Read one exact safe device summary for verified consumer mapping."
      operationId: "read_endpoint_device_api_v1_devices__device_id__get"
      security:
        -
          ServiceBearer: []
      parameters:
        -
          name: "device_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Device Id"
        -
          name: "X-Correlation-ID"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            title: "X-Correlation-Id"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DeviceSummaryEnvelope"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "404":
          description: "Device not found"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "401":
          description: "Service authentication failed"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "403":
          description: "Service scope is insufficient"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "422":
          description: "Validation Error"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      x-required-scopes:
        - "devices.read"
  "/api/v1/devices/{device_id}/capabilities":
    get:
      tags:
        - "endpoint-operations"
      summary: "Read Device Operation Capabilities"
      description: "Report only server acceptance for an active device and fixed capability."
      operationId: "read_device_operation_capabilities_api_v1_devices__device_id__capabilities_get"
      security:
        -
          ServiceBearer: []
      parameters:
        -
          name: "device_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Device Id"
        -
          name: "X-Correlation-ID"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            title: "X-Correlation-Id"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DeviceCapabilitiesEnvelope"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "404":
          description: "Active device not found"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "401":
          description: "Service authentication failed"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "403":
          description: "Service scope is insufficient"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "422":
          description: "Validation Error"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      x-required-scopes:
        - "devices.read"
  "/api/v1/devices/{device_id}/operations":
    post:
      tags:
        - "endpoint-operations"
      summary: "Create Device Operation"
      description: "Create or replay one operation owned by the authenticated service client."
      operationId: "create_device_operation_api_v1_devices__device_id__operations_post"
      security:
        -
          ServiceBearer: []
      parameters:
        -
          name: "device_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Device Id"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 8
            maxLength: 128
            pattern: "^[!-~][ -~]{6,126}[!-~]$"
            title: "Idempotency-Key"
        -
          name: "X-Correlation-ID"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            title: "X-Correlation-Id"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EndpointOperationCreateV1"
      responses:
        "201":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OperationResponseEnvelope"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "200":
          description: "Replayed endpoint operation"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OperationResponseEnvelope"
        "409":
          description: "Idempotency key conflict"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "503":
          description: "Safe result unavailable"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "401":
          description: "Service authentication failed"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "403":
          description: "Service scope is insufficient"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "422":
          description: "Validation Error"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      x-required-scopes:
        - "operations.create"
  "/api/v1/operations/{operation_id}":
    get:
      tags:
        - "endpoint-operations"
      summary: "Read Endpoint Operation"
      description: "Read one operation through stable service-client ownership."
      operationId: "read_endpoint_operation_api_v1_operations__operation_id__get"
      security:
        -
          ServiceBearer: []
      parameters:
        -
          name: "operation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Operation Id"
        -
          name: "X-Correlation-ID"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            title: "X-Correlation-Id"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OperationResponseEnvelope"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "404":
          description: "Endpoint operation not found"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "503":
          description: "Safe result unavailable"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "401":
          description: "Service authentication failed"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "403":
          description: "Service scope is insufficient"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
        "422":
          description: "Validation Error"
          headers:
            X-Correlation-ID:
              description: "Exact echo of the request tracing header."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      x-required-scopes:
        - "operations.read"
  "/api/v1/devices/{device_id}/module-operations":
    post:
      tags:
        - "endpoint-module-execution"
      summary: "Create Module Operation"
      description: "Create/replay a module parent; only Gateway WSS can deliver its children."
      operationId: "create_module_operation_api_v1_devices__device_id__module_operations_post"
      parameters:
        -
          name: "device_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Device Id"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 8
            maxLength: 128
            pattern: "^[!-~][ -~]{6,126}[!-~]$"
            title: "Idempotency-Key"
        -
          name: "X-Correlation-ID"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            title: "X-Correlation-Id"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ModuleOperationCreateV1"
      responses:
        "201":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ModuleOperationEnvelope"
        "422":
          description: "Validation Error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/api/v1/module-operations/{operation_id}":
    get:
      tags:
        - "endpoint-module-execution"
      summary: "Read Module Operation"
      description: "Read only a caller-owned parent and its safe typed child summaries."
      operationId: "read_module_operation_api_v1_module_operations__operation_id__get"
      parameters:
        -
          name: "operation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Operation Id"
        -
          name: "X-Correlation-ID"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
            title: "X-Correlation-Id"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ModuleOperationDetailEnvelope"
        "422":
          description: "Validation Error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/api/v1/modules":
    get:
      tags:
        - "endpoint-modules"
      summary: "List Modules"
      operationId: "list_modules_api_v1_modules_get"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ModuleListEnvelope"
  "/api/v1/modules/{module_key}":
    get:
      tags:
        - "endpoint-modules"
      summary: "Read Module"
      operationId: "read_module_api_v1_modules__module_key__get"
      parameters:
        -
          name: "module_key"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Module Key"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ModuleVersionViewEnvelope"
        "422":
          description: "Validation Error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/api/v1/modules/versions":
    post:
      tags:
        - "endpoint-modules"
      summary: "Create Module Version"
      operationId: "create_module_version_api_v1_modules_versions_post"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ModuleVersionCreateV1"
        required: true
      responses:
        "201":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                additionalProperties: true
                type: "object"
                title: "Response Create Module Version Api V1 Modules Versions Post"
        "422":
          description: "Validation Error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/api/v1/modules/{module_key}/versions/{version}":
    get:
      tags:
        - "endpoint-modules"
      summary: "Read Module Version"
      operationId: "read_module_version_api_v1_modules__module_key__versions__version__get"
      parameters:
        -
          name: "module_key"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Module Key"
        -
          name: "version"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Version"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ModuleVersionViewEnvelope"
        "422":
          description: "Validation Error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/api/v1/modules/{module_key}/versions/{version}/validate":
    post:
      tags:
        - "endpoint-modules"
      summary: "Validate Module Version"
      operationId: "validate_module_version_api_v1_modules__module_key__versions__version__validate_post"
      parameters:
        -
          name: "module_key"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Module Key"
        -
          name: "version"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Version"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ModuleValidationEnvelope"
        "422":
          description: "Validation Error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/api/v1/modules/{module_key}/versions/{version}/publish":
    post:
      tags:
        - "endpoint-modules"
      summary: "Publish Module Version"
      operationId: "publish_module_version_api_v1_modules__module_key__versions__version__publish_post"
      parameters:
        -
          name: "module_key"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Module Key"
        -
          name: "version"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Version"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ModuleVersionStateEnvelope"
        "422":
          description: "Validation Error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/api/v1/modules/{module_key}/versions/{version}/deprecate":
    post:
      tags:
        - "endpoint-modules"
      summary: "Deprecate Module Version"
      description: "Stop new module operations from using one immutable published version."
      operationId: "deprecate_module_version_api_v1_modules__module_key__versions__version__deprecate_post"
      parameters:
        -
          name: "module_key"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Module Key"
        -
          name: "version"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Version"
      responses:
        "200":
          description: "Successful Response"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ModuleVersionStateEnvelope"
        "422":
          description: "Validation Error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
components:
  schemas:
    DeviceIdentityV1:
      additionalProperties: false
      properties:
        schema_version:
          const: "device_identity_v1"
          title: "Schema Version"
          type: "string"
        device_id:
          format: "uuid"
          title: "Device Id"
          type: "string"
        platform:
          enum:
            - "linux"
            - "windows"
          title: "Platform"
          type: "string"
        hardware_fingerprint:
          maxLength: 256
          minLength: 8
          pattern: "^sha256:[a-z0-9][a-z0-9._-]{1,248}$"
          title: "Hardware Fingerprint"
          type: "string"
      required:
        - "schema_version"
        - "device_id"
        - "platform"
        - "hardware_fingerprint"
      title: "DeviceIdentityV1"
      type: "object"
    AgentSessionV1:
      additionalProperties: false
      properties:
        schema_version:
          const: "agent_session_v1"
          title: "Schema Version"
          type: "string"
        device_id:
          format: "uuid"
          title: "Device Id"
          type: "string"
        session_id:
          format: "uuid"
          title: "Session Id"
          type: "string"
        issued_at:
          format: "date-time"
          title: "Issued At"
          type: "string"
          "$comment": "model-only UTC normalization: timezone-aware values are normalized to UTC."
        expires_at:
          format: "date-time"
          title: "Expires At"
          type: "string"
          "$comment": "model-only UTC normalization: timezone-aware values are normalized to UTC."
      required:
        - "schema_version"
        - "device_id"
        - "session_id"
        - "issued_at"
        - "expires_at"
      title: "AgentSessionV1"
      type: "object"
    EnrollmentRequestV1:
      additionalProperties: false
      properties:
        schema_version:
          const: "enrollment_request_v1"
          title: "Schema Version"
          type: "string"
        platform:
          enum:
            - "linux"
            - "windows"
          title: "Platform"
          type: "string"
        hardware_fingerprint:
          maxLength: 256
          minLength: 8
          pattern: "^sha256:[a-z0-9][a-z0-9._-]{1,248}$"
          title: "Hardware Fingerprint"
          type: "string"
        installation_id:
          maxLength: 256
          minLength: 1
          title: "Installation Id"
          type: "string"
        requested_at:
          format: "date-time"
          title: "Requested At"
          type: "string"
          "$comment": "model-only UTC normalization: timezone-aware values are normalized to UTC."
      required:
        - "schema_version"
        - "platform"
        - "hardware_fingerprint"
        - "installation_id"
        - "requested_at"
      title: "EnrollmentRequestV1"
      type: "object"
    EnrollmentResponseV1:
