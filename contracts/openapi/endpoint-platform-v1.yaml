openapi: "3.1.0"
info:
  title: "Endpoint Platform Gateway API"
  version: "v1"
paths:
  "/agent/v1/enroll":
    post:
      security:
        -
          AgentBearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AgentEnrollmentRequestV1"
      responses:
        "200":
          description: "Recovered committed enrollment delivery"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentEnrollmentDeliveryV1"
        "201":
          description: "Created enrollment delivery"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentEnrollmentDeliveryV1"
  "/agent/v1/enroll/retry":
    post:
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EnrollmentDeliveryProofV1"
      responses:
        "200":
          description: "Recovered unacknowledged delivery"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentEnrollmentDeliveryV1"
  "/agent/v1/enroll/ack":
    post:
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EnrollmentDeliveryProofV1"
      responses:
        "204":
          description: "Enrollment delivery acknowledged"
  "/agent/v1/credentials/rotate":
    post:
      security:
        -
          AgentBearer: []
      responses:
        "201":
          description: "Created pending device credential"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DeviceCredentialRotationV1"
  "/agent/v1/credentials/activate":
    post:
      security:
        -
          AgentBearer: []
      responses:
        "204":
          description: "Pending credential activated"
  "/agent/v1/updates/recommendation":
    get:
      security:
        -
          AgentBearer: []
      parameters:
        -
          name: "platform"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "linux_amd64"
              - "windows_amd64"
        -
          name: "channel"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "stable"
              - "canary"
      responses:
        "200":
          description: "Active update recommendation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentUpdateRecommendationV1"
        "204":
          description: "No active update assignment"
  "/agent/v1/updates/{operation_id}/ack":
    post:
      security:
        -
          AgentBearer: []
      parameters:
        -
          name: "operation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AgentUpdateAcknowledgementV1"
      responses:
        "204":
          description: "Update acknowledgement recorded"
  "/agent/v1/updates/{operation_id}/reports":
    post:
      security:
        -
          AgentBearer: []
      parameters:
        -
          name: "operation_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AgentUpdateReportV1"
      responses:
        "200":
          description: "Update report recorded"
components:
  schemas:
    DeviceIdentityV1:
