[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endpoint-platform-client"
version = "0.1.0"
description = "TLS-verifying typed client for Endpoint Platform safe Device Context APIs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[tool.setuptools]
packages = ["endpoint_platform_client"]
